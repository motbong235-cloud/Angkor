<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>តាមដាន Order | AngkorTopUp</title>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/static/img/logo.svg" class="logo-img" width="36" height="36" alt="" />
        <span class="logo-text">Angkor<span>TopUp</span></span>
      </a>
      <a href="/" class="btn btn-outline btn-sm">← ទំព័រដើម</a>
    </div>
  </header>
  <main class="track-page">
    <div class="container">
      <div class="track-box">
        <h1>តាមដាន Order</h1>
        <p>បញ្ចូល Order Code (ឧ. AT1001)</p>
        <div class="form-group">
          <label>Order Code</label>
          <input type="text" id="orderCodeInput" placeholder="AT1001" style="text-transform:uppercase" />
        </div>
        <button class="btn btn-primary btn-block" id="btnTrack">តាមដាន</button>
        <div class="track-result" id="trackResult"></div>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('btnTrack').onclick = doTrack;
    document.getElementById('orderCodeInput').onkeydown = e => { if (e.key === 'Enter') doTrack(); };
    async function doTrack() {
      const code = document.getElementById('orderCodeInput').value.trim();
      const result = document.getElementById('trackResult');
      if (!code) {
        result.className = 'track-result show';
        result.innerHTML = '<p style="color:var(--danger);text-align:center">សូមបញ្ចូល Order Code</p>';
        return;
      }
      const r = await fetch('/api/track?id=' + encodeURIComponent(code));
      const data = await r.json();
      result.className = 'track-result show';
      if (!data.ok) {
        result.innerHTML = `<p style="color:var(--danger);text-align:center">${data.error || 'មិនឃើញ'}</p>`;
        return;
      }
      const o = data.order;
      result.innerHTML = `
        <div class="order-summary">
          <div class="row"><span>Order</span><span><strong>${o.id}</strong></span></div>
          <div class="row"><span>ស្ថានភាព</span><span class="status-badge ${o.status === 'completed' || o.status === 'paid' ? 'completed' : 'processing'}">${o.status}</span></div>
          <div class="row"><span>ហ្គេម</span><span>${o.game_name || ''}</span></div>
          <div class="row"><span>Package</span><span>${o.package_name || ''}</span></div>
          <div class="row"><span>Player</span><span>${o.player_id || ''}</span></div>
          <div class="row total"><span>តម្លៃ</span><span>$${Number(o.price || 0).toFixed(2)}</span></div>
        </div>`;
    }
  </script>
</body>
</html>
